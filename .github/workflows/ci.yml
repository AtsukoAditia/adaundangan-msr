name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository foundation
        run: |
          test -f README.md
          test -f .clinerules
          test -f .clineignore
          test -f PROJECT_CONTEXT.md
          test -f TASKS.md
          test -f CLINE_MASTER_PROMPT.md
          test -f docs/OPERATIONAL_SOP.md
          test -f docs/GITHUB_RELEASES_DEMO.md

      - name: Setup Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Install dependencies without lockfile
        if: hashFiles('package.json') != '' && hashFiles('package-lock.json') == ''
        run: npm install

      - name: Lint
        if: hashFiles('package.json') != ''
        run: npm run lint

      - name: Typecheck
        if: hashFiles('package.json') != ''
        run: npm run typecheck

      - name: Test
        if: hashFiles('package.json') != ''
        run: npm run test

      - name: Build
        if: hashFiles('package.json') != ''
        run: npm run build
